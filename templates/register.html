{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="navy-card">
                <h3 class="fw-bold text-center text-light mb-4">Create Your Account</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-light fw-semibold">Full Name</label>
                        <input type="text" name="name" class="form-control" required placeholder="Enter your full name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-light fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" required placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-light fw-semibold">Phone Number</label>
                        <input type="tel" name="phone" class="form-control" required placeholder="Enter contact number">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-light fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required placeholder="Create a password">
                    </div>
                    <button type="submit" class="btn btn-gold w-100 mb-3 fw-bold">Sign Up</button>
                </form>
                
                <!-- Fixed High-Contrast Footer Link -->
                <p class="text-center text-light mb-0 pt-2 fs-6">
                    Already registered? <a href="{{ url_for('login') }}" class="text-warning fw-bold text-decoration-underline ms-1">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
