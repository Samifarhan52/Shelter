{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="white-card">
                <h3 class="fw-bold text-center mb-4" style="color: var(--navy-dark);">Admin CMS Portal</h3>
                <form method="POST" action="{{ url_for('admin') }}">
                    <input type="hidden" name="login" value="1">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Admin Email</label>
                        <input type="email" name="email" class="form-control" required placeholder="admin@shelterhunt.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required placeholder="Enter admin password">
                    </div>
                    <button type="submit" class="btn btn-gold w-100 fw-bold py-2">Sign In to Dashboard</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
